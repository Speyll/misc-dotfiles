[backdrop]
blur_intensity = 0.0

[bar.default]
center = [ "clock", "weather" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "session" ]
position = "left"
reserve_space = false
smart_auto_hide = true
start = [ "launcher", "workspaces" ]

    [bar.default.monitor.HDMI-A-1]
    end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "session" ]
    position = "top"
    reserve_space = true
    smart_auto_hide = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1738.0
    output = "HDMI-A-1"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
niri_overview_type_to_launch_enabled = true
settings_show_advanced = false

    [shell.launcher]
    pinned = [ "firefox", "pcmanfm-qt", "Alacritty" ]

    [shell.panel]
    borders = false
    shadow = false

[theme]
builtin = "Gruvbox"

[wallpaper]
directory = "/tmp"

    [wallpaper.default]
    path = "/tmp/wall.jpg"

    [wallpaper.last]
    path = "/tmp/wall.jpg"

[widget.workspaces]
active_pill_size = 2.1499999999999999
show_labels = false
